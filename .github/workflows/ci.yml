name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:engine
      - run: npm run lint
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: keel-core
        run: cargo test --manifest-path contracts/keel-core/Cargo.toml
      - name: keel-vault
        run: cargo test --manifest-path contracts/keel-vault/Cargo.toml
